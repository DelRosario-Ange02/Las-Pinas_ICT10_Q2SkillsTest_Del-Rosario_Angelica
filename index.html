
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills Test</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <style>
        body {
            background-color: #fff8e7;
            color: #800020;
            font-family: 'Gill Sans', sans-serif;
            text-align: center;
        }
        header {
            background-color: #800020;
            color: #f0c040;
            padding: 40px 20px;
            border-bottom: 6px solid #d4a017;
        }
        h1 {
            font-family: 'Gill Sans', sans-serif;
            font-weight: 800;
        }
        main {
            max-width: 500px;
            margin: 40px auto;
            padding: 30px;
            background-color: white;
            border: 2px solid #d4a017;
            border-radius: 12px;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #800020;
            border-radius: 6px;
        }
        input[type="button"] {
            background-color: #800020;
            color: #f0c040;
            border: none;
            padding: 10px 30px;
            margin-top: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        input[type="button"]:hover {
            background-color: #a52a2a;
            color: white;
        }
        #result {
            margin-top: 20px;
            font-weight: bold;
            color: #800020;
        }
        .reactor {
            width: 20px;
            height: 20px;
            background-color: #f0c040;
            border-radius: 50%;
            margin: 0 auto 10px;
        }
    </style>
</head>

<body>
    <header>
        <div class="reactor"></div>
        <h1>Element Checker</h1>
        <p>Type a non-metal element to see the information of the element.</p>
    </header>
    <main>
        <form onsubmit="return false;">
            <input type="text" id="elementInput" placeholder="Enter a non-metal element">
            <br>
            <input type="button" py-click="element_info" value="Check Element">
        </form>
        <div id="result"></div>
    </main>

    <script type="py" src="main.py"></script>

</body>
</html>
